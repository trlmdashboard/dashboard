  $$('[data-m]').forEach(b=>b.onclick=()=>go(async()=>{const t=b.closest('tr'),g=k=>+t.querySelector(`[data-k=${k}]`).value||0;await rpc('api_save_target',{p_map:+b.dataset.m,p_shg_loan:g('shg_loan_target'),p_shg_amt:g('shg_amount_target'),p_ind_loan:g('ind_loan_target'),p_ind_amt:g('ind_amount_target')});toast('Target updated')}))});

async function reportView(){const lv=S.user.role==='admin'?[['district_name','District'],['block_name','Block'],['bank_name','Bank'],['branch_name','Branch']]:S.user.role==='district'?[['block_name','Block'],['bank_name','Bank'],['branch_name','Branch']]:[['bank_name','Bank'],['branch_name','Branch']];
 $('#v').innerHTML=`<div class=pnl><div class=grid>${campSel()}<label>Group by<select id=gb>${lv.map((x,i)=>`<option value=${i}>${x[1]}${i===lv.length-1&&lv.length>1?' (detail)':''}</option>`).join('')}</select></label></div></div><div id=rp></div>`;let data=[];
 const draw=()=>{const gi=+$('#gb').value,keys=lv.slice(0,gi+1).map(x=>x[0]),m={};
  data.forEach(r=>{const k=keys.map(x=>r[x]).join(' | ');const a=m[k]??(m[k]={l:keys.map(x=>r[x]),v:{}});Object.keys(r).forEach(f=>{if(typeof r[f]==='number'&&f!=='map_id')a.v[f]=(a.v[f]||0)+r[f]})});
  const rows=Object.values(m),tot={};rows.forEach(a=>Object.entries(a.v).forEach(([f,n])=>tot[f]=(tot[f]||0)+n));
  const cs=p=>['loan_target','amount_target','sub_cnt','sub_amt','san_cnt','san_amt','dis_cnt','dis_amt'].map(s=>s.includes('target')?p+'_'+s:p+'_'+s.replace('_',''==''?'':'_')),
  F=p=>[p+'_loan_target',p+'_amount_target',p+'_sub_cnt',p+'_sub_amt',p+'_san_cnt',p+'_san_amt',p+'_dis_cnt',p+'_dis_amt'],H=['Loan target','Amount target','Submitted #','Submitted ₹','Sanctioned #','Sanctioned ₹','Disbursed #','Disbursed ₹'];
  const cells=v=>[...F('shg'),...F('ind')].map(f=>`<td>${fm(v[f])}`).join('');
  $('#rp').innerHTML=kpiHtml(tot)+`<div class="pnl tw"><table><thead><tr><th rowspan=2>${lv.slice(0,gi+1).map(x=>x[1]).join(' / ')}<th colspan=8>SHG Loans<th colspan=8>Individual Loans<tr>${H.map(h=>`<th>${h}`).join('')}${H.map(h=>`<th>${h}`).join('')}</thead><tbody>${rows.map(a=>`<tr><td>${a.l.map(esc).join(' / ')}${cells(a.v)}`).join('')||'<tr><td>No data'}<tr style="font-weight:700"><td>Total${cells(tot)}</tbody></table></div>`;countUp()};
 const ld=()=>go(async()=>{const c=$('#cs').value;data=c?await rpc('api_report',{p_campaign:c}):[];draw()});$('#cs').onchange=ld;$('#gb').onchange=draw;ld()}
const uniq=(a,k,l)=>[...new Map(a.map(x=>[x[k],x[l]]))],nm=x=>x.shg_name||x.member_name||'';
const stg=(id,v,r=document)=>r.querySelectorAll(id+' button').forEach(x=>x.classList.toggle('on',x.dataset.v===String(v)));
const tgb=(id,cb,r=document)=>r.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{stg(id,b.dataset.v,r);cb(b.dataset.v)});
const fin=p=>`<label>Submission date<input id=${p}sd type=date></label><label>Proposed amount (₹)<input id=${p}pa type=number inputmode=decimal min=0></label>
<label class=span2>Loan sanctioned<div class=tg id=${p}ts><button data-v=0 class=on>No</button><button data-v=1>Yes</button></div></label>
<label class=${p}s hidden>Sanction date<input id=${p}nd type=date></label><label class=${p}s hidden>Sanctioned amount (₹)<input id=${p}na type=number inputmode=decimal min=0></label>
<label class="span2 ${p}s" hidden>Loan disbursed<div class=tg id=${p}td><button data-v=0 class=on>No</button><button data-v=1>Yes</button></div></label>
<label class=${p}d hidden>Disburse date<input id=${p}dd type=date></label><label class=${p}d hidden>Disbursed amount (₹)<input id=${p}da type=number inputmode=decimal min=0></label>`;
function finCtl(p,r){let san=false,dis=false;const g=i=>r.querySelector('#'+p+i),vis=()=>{r.querySelectorAll('.'+p+'s').forEach(e=>e.hidden=!san);r.querySelectorAll('.'+p+'d').forEach(e=>e.hidden=!(san&&dis))};
 tgb('#'+p+'ts',v=>{san=v==='1';if(!san){dis=false;stg('#'+p+'td',0,r)}vis()},r);tgb('#'+p+'td',v=>{dis=v==='1';vis()},r);
 return{set(x){g('sd').value=x?.submission_date||'';g('pa').value=x?.proposed_amount||'';san=!!x?.sanctioned;dis=!!x?.disbursed;stg('#'+p+'ts',san?1:0,r);stg('#'+p+'td',dis?1:0,r);g('nd').value=x?.sanction_date||'';g('na').value=x?.sanctioned_amount||'';g('dd').value=x?.disburse_date||'';g('da').value=x?.disbursed_amount||'';vis()},
 get:()=>({submission_date:g('sd').value,proposed_amount:g('pa').value,sanctioned:san,sanction_date:g('nd').value,sanctioned_amount:g('na').value,disbursed:dis,disburse_date:g('dd').value,disbursed_amount:g('da').value})}}
function quick(x,done){const m=document.createElement('div');m.className='sheet';
 m.innerHTML=`<div class=sh-b></div><div class=sh-c><div class=sh-h><div><b>${esc(nm(x))}</b><small>${esc([x.gp_name,x.village_name].filter(Boolean).join(' · '))}</small><small>${esc(x.bank_name)} / ${esc(x.branch_name)} · ${esc(x.campaign_name)}</small></div><button class=ib id=qx title=Close>${ic('x')}</button></div><div class="grid g2">${fin('q')}</div><div class=row><button class=pr id=qsv>${ic('check')}<span>Update</span></button></div></div>`;
 document.body.appendChild(m);const cl=()=>m.remove(),ctl=finCtl('q',m);ctl.set(x);
 m.querySelector('.sh-b').onclick=cl;m.querySelector('#qx').onclick=cl;
 m.querySelector('#qsv').onclick=()=>go(async()=>{await rpc('api_loan_save',{p:{loan_id:x.loan_id,map_id:x.map_id,loan_type:x.loan_type,shg_id:x.shg_id,member_name:x.member_name,...ctl.get()}});toast('Loan updated');cl();done()})}
async function dashView(){$('#v').innerHTML=`<div class=pnl>${campSel()}</div><div id=rp></div>`;
 const ld=()=>go(async()=>{const c=$('#cs').value,d=c?await rpc('api_report',{p_campaign:c}):[],t={};d.forEach(r=>Object.keys(r).forEach(k=>{if(typeof r[k]==='number'&&k!=='map_id')t[k]=(t[k]||0)+r[k]}));

async function loansView(){let r=await rpc('api_loan_list',{p_campaign:null}),f='all';
 const stt=x=>x.disbursed?['Disbursed','d']:x.sanctioned?['Sanctioned','s']:['Submitted','p'];
 $('#v').innerHTML=`<div class=pnl><div class=grid><label>Search<input id=fq placeholder="SHG, member, village, bank, branch"></label><label>Campaign<select id=cf><option value="">All campaigns</option>${uniq(r,'campaign_name','campaign_name').map(c=>`<option>${esc(c[0])}</option>`).join('')}</select></label></div><div class=tg id=sf style="margin-top:14px">${[['all','All'],['p','Submitted'],['s','Sanctioned'],['d','Disbursed']].map(a=>`<button data-v=${a[0]} ${a[0]==='all'?'class=on':''}>${a[1]}</button>`).join('')}</div><p class=mu id=cc style="margin:12px 0 0"></p></div><div class="pnl tw lt-d" id=ltb></div><div class=lcs id=lcs></div>`;
 const reload=()=>go(async()=>{r=await rpc('api_loan_list',{p_campaign:null});draw()});
 const draw=()=>{const q=$('#fq').value.toLowerCase(),c=$('#cf').value,l=r.map((x,i)=>[x,i]).filter(([x])=>(!c||x.campaign_name===c)&&(f==='all'||stt(x)[1]===f)&&(!q||[nm(x),x.gp_name,x.village_name,x.bank_name,x.branch_name].join(' ').toLowerCase().includes(q)));
  $('#cc').textContent=`${l.length} of ${r.length} loans · tap a loan to update its status`;
  $('#lcs').innerHTML=l.map(([x,i])=>{const s=stt(x);return`<div class=lcard data-i=${i}><div class=lc-t><div><b>${esc(nm(x))}</b><small>${esc([x.gp_name,x.village_name].filter(Boolean).join(' · ')||x.loan_type+' loan')}</small></div><span class="st st-${s[1]}">${s[0]}</span></div><div class=lc-m><span>${esc(x.bank_name)} / ${esc(x.branch_name)}</span><span>${esc(x.campaign_name)} · ${x.loan_type}</span></div>
   <div class=lc-s><div><small>Proposed</small><b>₹ ${fm(x.proposed_amount)}</b><small>${x.submission_date}</small></div><div><small>Sanctioned</small><b>${x.sanctioned?'₹ '+fm(x.sanctioned_amount):'—'}</b><small>${x.sanction_date||'Not yet'}</small></div><div><small>Disbursed</small><b>${x.disbursed?'₹ '+fm(x.disbursed_amount):'—'}</b><small>${x.disburse_date||'Not yet'}</small></div></div>
   <div class=lc-a>${x.editable?`<button class=ib data-e=${i} title=Edit>${ic('edit')}</button><button class='ib del' data-d=${i} title=Delete>${ic('trash')}</button>`:'<span class=tag>Closed</span>'}</div></div>`}).join('')||'<p class=mu>No loans found</p>';
  $('#ltb').innerHTML=`<table><thead><tr><th>Campaign<th>Bank / Branch<th>Type<th>SHG / Member<th>GP / Village<th>Submitted<th>Proposed ₹<th>Sanctioned<th>Disbursed<th>Status<th></thead><tbody>${l.map(([x,i])=>{const s=stt(x);return`<tr class=rt data-i=${i}><td>${esc(x.campaign_name)}<td>${esc(x.bank_name)} / ${esc(x.branch_name)}<td>${x.loan_type}<td>${esc(nm(x))}<td>${esc([x.gp_name,x.village_name].filter(Boolean).join(' / '))}<td>${x.submission_date}<td>${fm(x.proposed_amount)}<td>${x.sanctioned?fm(x.sanctioned_amount)+' ('+x.sanction_date+')':'No'}<td>${x.disbursed?fm(x.disbursed_amount)+' ('+x.disburse_date+')':'No'}<td><span class="st st-${s[1]}">${s[0]}</span><td class=act>${x.editable?`<button class=ib data-e=${i} title=Edit>${ic('edit')}</button><button class='ib del' data-d=${i} title=Delete>${ic('trash')}</button>`:'<span class=tag>Closed</span>'}`}).join('')||'<tr><td colspan=11>No loans found'}</tbody></table>`;
  $$('#lcs .lcard,#ltb tbody tr[data-i]').forEach(c=>{const x=r[c.dataset.i];c.onclick=e=>{if(e.target.closest('button'))return;if(!x.editable)return toast('Campaign closed. No changes allowed.',1);quick(x,reload)};
   const e=c.querySelector('[data-e]'),d=c.querySelector('[data-d]');if(e)e.onclick=()=>{S.edit=x;open('loan')};if(d)d.onclick=()=>confirm('Delete this loan record?')&&go(async()=>{await rpc('api_loan_delete',{p_id:x.loan_id});toast('Deleted');reload()})})};
 tgb('#sf',v=>{f=v;draw()});$('#fq').oninput=draw;$('#cf').onchange=draw;draw()}
async function loanView(){const pre=S.edit;S.edit=null;const opts=await rpc('api_block_options'),open_=opts.filter(x=>x.open);let ed=null,shg=null,type='SHG';
 $('#v').innerHTML=`<div class=pnl><h3 id=ft>Register Loan</h3>${open_.length?'':'<p class=mu>No open campaign with bank branches mapped to your block. Data entry is closed.</p>'}<div class="grid g2">
 <label class=span2>Campaign<select id=lc></select></label><label class=span2>Bank<select id=lb></select></label><label class=span2>Bank branch<select id=lr></select></label>
 <label class=span2>Type of loan<div class=tg id=lt><button data-v=SHG class=on>SHG Loan</button><button data-v=Individual>Individual Loan</button></div></label></div>
 <div id=sg style="margin-top:14px"><label>Search SHG name (your block)<input id=sq placeholder="Type at least 2 letters" autocomplete=off></label><div id=sr></div><div id=sc></div></div>
 <div id=ib hidden style="margin-top:14px"><label>Member name<input id=mn></label></div>
 <div class="grid g2" style="margin-top:14px">${fin('l')}</div>
 <div class="row sb"><button class=pr id=sv ${open_.length?'':'disabled'}>${ic('check')}<span>Save</span></button><button id=cn hidden>${ic('x')}<span>Cancel</span></button></div></div>`;
 const sel=(id,l,cur)=>{const s=$(id);s.innerHTML=l.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('');if(cur&&l.some(x=>x[0]===cur))s.value=cur};
 const campL=()=>uniq(open_,'campaign_id','campaign_name'),bankL=()=>uniq(open_.filter(x=>x.campaign_id===$('#lc').value),'bank_id','bank_name'),brL=()=>open_.filter(x=>x.campaign_id===$('#lc').value&&x.bank_id===$('#lb').value).map(x=>[x.branch_id,x.branch_name]);
 const syncB=()=>{sel('#lb',bankL(),$('#lb').value);syncR()},syncR=()=>sel('#lr',brL(),$('#lr').value);
 sel('#lc',campL());syncB();$('#lc').onchange=syncB;$('#lb').onchange=syncR;
 const ctl=finCtl('l',document),typ=()=>{$('#sg').hidden=type!=='SHG';$('#ib').hidden=type==='SHG'};tgb('#lt',v=>{type=v;typ()});typ();ctl.set(null);
 let tm;$('#sq').oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>go(async()=>{const q=$('#sq').value.trim();if(q.length<2){$('#sr').innerHTML='';return}const r=await rpc('api_shg_search',{p_q:q});
  $('#sr').innerHTML=r.length?`<div class=res>${r.map((x,i)=>`<div data-i=${i}>${esc(x.shg_name)}<br><small>GP: ${esc(x.gp_name)} · Village: ${esc(x.village_name)} · ID ${x.shg_id}</small></div>`).join('')}</div>`:'<p class=mu>No SHG found in your block</p>';
  $$('#sr [data-i]').forEach(d=>d.onclick=()=>{shg=r[d.dataset.i];showShg();$('#sr').innerHTML='';$('#sq').value=''})}),300)};
 const showShg=()=>$('#sc').innerHTML=shg?`<div class=chip><b>${esc(shg.shg_name)}</b><br><small>GP: ${esc(shg.gp_name)} · Village: ${esc(shg.village_name)}</small></div>`:'';
 const reset=()=>{ed=null;shg=null;showShg();$('#mn').value='';ctl.set(null);$('#ft').textContent='Register Loan';$('#sv span').textContent='Save';$('#cn').hidden=true};
 $('#cn').onclick=()=>ed?open('loans'):reset();
 $('#sv').onclick=()=>go(async()=>{const m=open_.find(x=>x.campaign_id===$('#lc').value&&x.bank_id===$('#lb').value&&x.branch_id===$('#lr').value);if(!m)throw Error('Select campaign, bank and branch');
  await rpc('api_loan_save',{p:{loan_id:ed,map_id:m.map_id,loan_type:type,shg_id:shg?.shg_id,member_name:$('#mn').value,...ctl.get()}});const was=ed;toast(was?'Loan updated':'Loan saved');if(was)open('loans');else{reset();scrollTo(0,0)}});
 if(pre){const m=opts.find(y=>y.map_id===pre.map_id);if(!m||!m.open){toast('This campaign is closed',1);return open('loans')}ed=pre.loan_id;sel('#lc',campL(),m.campaign_id);syncB();$('#lb').value=m.bank_id;syncR();$('#lr').value=m.branch_id;type=pre.loan_type;stg('#lt',type);typ();shg=pre.shg_id?{shg_id:pre.shg_id,shg_name:pre.shg_name,gp_name:pre.gp_name,village_name:pre.village_name}:null;showShg();$('#mn').value=pre.member_name||'';ctl.set(pre);$('#ft').textContent='Edit Loan #'+pre.loan_id;$('#sv span').textContent='Update';$('#cn').hidden=false}}
function skin(){
 $$('button:not([data-sk])').forEach(b=>{b.dataset.sk=1;if(b.closest('nav,.tg,#tp'))return;b.classList.add('ab');if(b.classList.contains('pr'))b.classList.add('ab-p');if(b.classList.contains('ib'))b.classList.add('ab-i');if(b.closest('td'))b.classList.add('ab-s')});
 $$('input:not([data-sk])').forEach(i=>{i.dataset.sk=1;i.classList.add('ai')});
 $$('select:not([data-sk])').forEach(i=>{i.dataset.sk=1;i.classList.add('ai')});
 $$('table:not([data-sk])').forEach(t=>{t.dataset.sk=1;t.classList.add('at')})}
new MutationObserver(skin).observe(document.body,{childList:true,subtree:true});skin();
