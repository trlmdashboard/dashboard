<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metal Scrap Shop</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#1c1f24; --muted:#6b7280; --border:#d9dde3;
    --primary:#1f6feb; --buy:#c2410c; --sell:#15803d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101216; --card:#1a1d23; --text:#e8eaee; --muted:#9aa1ad; --border:#2c313a; --primary:#4c8dff; --buy:#fb923c; --sell:#4ade80; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:1.15rem;margin:0;flex:1}
  .back{background:none;border:none;color:var(--primary);font-size:1rem;cursor:pointer;padding:6px 0;display:none}
  main{max-width:520px;margin:0 auto;padding:0 16px 32px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
  .menu{display:grid;gap:12px}
  .menu button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;font-size:1.05rem;
    background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;cursor:pointer}
  .menu button:active{transform:scale(.98)}
  .menu .ico{font-size:1.5rem}
  .menu small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
  label.lbl{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px}
  label.lbl:first-child{margin-top:0}
  input[type=date],input[type=number],textarea{width:100%;padding:12px;font-size:1rem;color:var(--text);background:var(--bg);
    border:1px solid var(--border);border-radius:10px;font-family:inherit}
  textarea{min-height:80px;resize:vertical}
  .radios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .radios label{cursor:pointer}
  .radios input{position:absolute;opacity:0;pointer-events:none}
  .radios span{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1.5px solid var(--border);
    border-radius:10px;font-weight:600}
  .radios span::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
  .radios input:checked + span.b{border-color:var(--buy);color:var(--buy)}
  .radios input:checked + span.s{border-color:var(--sell);color:var(--sell)}
  .radios input:checked + span::before{border-color:currentColor;background:radial-gradient(currentColor 45%,transparent 50%)}
  .radios input:focus-visible + span{outline:2px solid var(--primary)}
  .save{margin-top:18px;width:100%;padding:14px;font-size:1.05rem;font-weight:600;color:#fff;background:var(--primary);
    border:none;border-radius:10px;cursor:pointer}
  .save:disabled{opacity:.6}
  .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.9rem;display:none}
  .msg.ok{display:block;background:#dcfce7;color:#14532d}
  .msg.err{display:block;background:#fee2e2;color:#7f1d1d}
  .rec{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .rec:last-child{border-bottom:none}
  .rec .amt{font-weight:700;white-space:nowrap}
  .rec .b{color:var(--buy)} .rec .s{color:var(--sell)}
  .rec .meta{color:var(--muted);font-size:.8rem;margin-top:2px;word-break:break-word}
  .empty{color:var(--muted);text-align:center;padding:16px 0}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .totals div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
  .totals small{color:var(--muted);display:block;font-size:.75rem}
  .totals b{font-size:1.05rem}
</style>
</head>
<body>
<header>
  <button class="back" id="back">&larr; Menu</button>
  <h1 id="title">Metal Scrap Shop</h1>
</header>

<main>
  <!-- MAIN MENU -->
  <section id="menu" class="menu">
    <button data-go="add"><span class="ico">&#10133;</span><span>Add Record<small>Record a buying or selling entry</small></span></button>
    <button data-go="list"><span class="ico">&#128203;</span><span>View Records<small>Latest entries and totals</small></span></button>
  </section>

  <!-- ADD RECORD -->
  <section id="add" hidden>
    <form class="card" id="form" autocomplete="off">
      <label class="lbl">Type</label>
      <div class="radios">
        <label><input type="radio" name="type" value="buying" checked><span class="b">Buying</span></label>
        <label><input type="radio" name="type" value="selling"><span class="s">Selling</span></label>
      </div>

      <label class="lbl" for="date">Date</label>
      <input type="date" id="date" required>

      <label class="lbl" for="amount">Amount (&#8377;)</label>
      <input type="number" id="amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>

      <label class="lbl" for="remark">Remark</label>
      <textarea id="remark" placeholder="e.g. 25 kg copper wire from Ramesh"></textarea>

      <button class="save" id="save" type="submit">Save Record</button>
      <div class="msg" id="msg"></div>
    </form>
  </section>

  <!-- VIEW RECORDS -->
  <section id="list" hidden>
    <div class="totals">
      <div><small>Total Buying</small><b id="tb">-</b></div>
      <div><small>Total Selling</small><b id="ts">-</b></div>
    </div>
    <div class="card" id="records"><div class="empty">Loading...</div></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://rxutrcgfkyovcfhgnfpl.supabase.co";
const SUPABASE_KEY = "sb_publishable_peuP9pAReUEQiAnlZ5G8dg_oeFaPwCf";
const ENDPOINT = SUPABASE_URL + "/rest/v1/metalscrap_shop";
const HEADERS = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };

const $ = id => document.getElementById(id);
const titles = { menu: "Metal Scrap Shop", add: "Add Record", list: "Records" };

function todayStr(){
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function show(name){
  ["menu","add","list"].forEach(s => $(s).hidden = s !== name);
  $("title").textContent = titles[name];
  $("back").style.display = name === "menu" ? "none" : "block";
  if(name === "add"){ $("date").value = todayStr(); $("msg").className = "msg"; }
  if(name === "list") loadRecords();
}
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => show(b.dataset.go));
$("back").onclick = () => show("menu");

const inr = n => "\u20B9" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("msg"), btn = $("save");
  btn.disabled = true; msg.className = "msg";
  const body = {
    type: document.querySelector('input[name="type"]:checked').value,
    date: $("date").value,
    amount: parseFloat($("amount").value),
    remark: $("remark").value.trim() || null
  };
  try{
    const r = await fetch(ENDPOINT, { method: "POST", headers: { ...HEADERS, Prefer: "return=minimal" }, body: JSON.stringify(body) });
    if(!r.ok) throw new Error((await r.text()) || r.status);
    msg.textContent = "Record saved."; msg.className = "msg ok";
    $("amount").value = ""; $("remark").value = "";
  }catch(err){
    msg.textContent = "Could not save: " + err.message; msg.className = "msg err";
  }finally{ btn.disabled = false; }
});

async function loadRecords(){
  const box = $("records");
  box.innerHTML = '<div class="empty">Loading...</div>';
  try{
    const r = await fetch(ENDPOINT + "?select=id,type,date,amount,remark&order=date.desc,id.desc&limit=100", { headers: HEADERS });
    if(!r.ok) throw new Error(await r.text());
    const rows = await r.json();
    let tb = 0, ts = 0;
    rows.forEach(x => x.type === "buying" ? tb += +x.amount : ts += +x.amount);
    $("tb").textContent = inr(tb); $("ts").textContent = inr(ts);
    if(!rows.length){ box.innerHTML = '<div class="empty">No records yet.</div>'; return; }
    box.innerHTML = "";
    rows.forEach(x => {
      const d = document.createElement("div"); d.className = "rec";
      const c = x.type === "buying" ? "b" : "s";
      const left = document.createElement("div");
      const t = document.createElement("div"); t.className = c; t.style.fontWeight = "600";
      t.textContent = x.type === "buying" ? "Buying" : "Selling";
      const m = document.createElement("div"); m.className = "meta";
      m.textContent = x.date + (x.remark ? " \u00B7 " + x.remark : "");
      left.append(t, m);
      const a = document.createElement("div"); a.className = "amt " + c; a.textContent = inr(x.amount);
      d.append(left, a); box.append(d);
    });
  }catch(err){
    box.innerHTML = ""; const e = document.createElement("div"); e.className = "empty";
    e.textContent = "Could not load: " + err.message; box.append(e);
  }
}
</script>
</body>
</html>
